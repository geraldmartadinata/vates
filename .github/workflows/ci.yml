name: ci

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ./vates-core
        run: |
          python -m venv .venv
          .venv/Scripts/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-httpx httpx ruff
      - name: Run tests
        working-directory: ./vates-core
        run: |
          .venv/Scripts/activate
          python -m pytest -q
      - name: Run lint
        working-directory: ./vates-core
        run: |
          .venv/Scripts/activate
          ruff check .
